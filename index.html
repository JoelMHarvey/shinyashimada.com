<meta property="og:description" content="A balcony plant journal, Tokyo today, a chocolate croissant hunt, and an Italian game.">

<link rel="stylesheet" href="/assets/css/site.css">
<link rel="stylesheet" href="/assets/css/home.css">
<script>
  /* Set the theme before first paint so the page never flashes white. */
  (function () {
    try {
      var t = localStorage.getItem('ss.theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
  })();
</script>
</head>

<a class="skip-link" href="#main" data-i18n="nav.skip">Skip to content</a>
<header data-shell="header"></header>

        <p data-i18n="home.card.plants.body"></p>
        <span class="section-card__go" data-i18n="home.card.plants.go"></span>
      </a>

      <a class="section-card card-tokyo" href="/tokyo/">

        <p data-i18n="home.card.tokyo.body"></p>
        <span class="section-card__go" data-i18n="home.card.tokyo.go"></span>
      </a>

      <a class="section-card card-croissants" href="/croissants/">

      </a>

      <a class="section-card card-italian" href="/italian/">

        <h2 data-i18n="home.card.italian.title"></h2>
        <p data-i18n="home.card.italian.body"></p>
        <span class="section-card__go" data-i18n="home.card.italian.go"></span>
      </a>

      <a class="section-card card-forza" href="/forza/">
        <div class="section-card__icon">⏱️</div>
        <h2 data-i18n="home.card.forza.title"></h2>
        <p data-i18n="home.card.forza.body"></p>
        <span class="section-card__go" data-i18n="home.card.forza.go"></span>
      </a>

      <a class="section-card card-research" href="/research/">
        <div class="section-card__icon">📚</div>

</main>

Shell.init('home');

/* A quiet live touch: current Tokyo temperature in the hero strip. */
(function () {
  var strip = document.getElementById('now-strip');
  var tempEl = document.getElementById('now-temp');
  var descEl = document.getElementById('now-desc');
  var latest = null;

  function paint() {
    if (!latest || !latest.current) return;
    tempEl.textContent = Math.round(latest.current.temperature_2m) + '\u00b0C';
    descEl.textContent = Weather.icon(latest.current.weather_code, latest.current.is_day) + ' ' +
                         Weather.describe(latest.current.weather_code);
  }

  fetch('/api/weather')
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (data) {
      if (!data || !data.ok || !data.current) return;
      latest = data;
      strip.hidden = false;
      paint();
    })
    .catch(function () { /* the hero reads fine without it */ });

  document.addEventListener('langchange', paint);
})();
