# The site's own tests on every push and pull request and once a week:
# `npm test` (Node only) and `npm run test:browser` (the pages in Chromium,
# against the site served on port 8899 as the README says).
#
# The runner's clock is UTC. tests/care.test.mjs fails 4 of its 32 checks on
# a machine set to Tokyo time and passes here: that is a fault in the test's
# date handling, still open, and this workflow does not exercise it.
#
# No secret is needed. Nothing here deploys: the site is deployed by hand.
name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '4 1 * * 5'   # Fridays, UTC: a quiet week is still tested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  browser:
    name: npm run test:browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: serve the site on port 8899
        run: |
          npx http-server -p 8899 -c-1 . > /tmp/http-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8899/ && exit 0
            sleep 1
          done
          cat /tmp/http-server.log; exit 1
      - run: npm run test:browser
