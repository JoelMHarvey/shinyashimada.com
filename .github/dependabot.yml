# Automatic dependency updates. Weekly; minor and patch updates arrive as one
# pull request per ecosystem, majors one at a time, at most three open each.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:20"
      timezone: Europe/London
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:20"
      timezone: Europe/London
    open-pull-requests-limit: 3
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
