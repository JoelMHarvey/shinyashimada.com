<!doctype html>
<html lang="en" data-title-key="tk.title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tokyo Today — Shinya Shimada</title>
<meta name="description" content="Tokyo weather and headlines, read as balcony weather: a seven-day forecast with warnings for frost, heat, wind and heavy rain.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css">
<link rel="stylesheet" href="/assets/css/viz.css">
<link rel="stylesheet" href="/assets/css/tokyo.css">
<script>(function(){try{var t=localStorage.getItem('ss.theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
</head>
<body>
<a class="skip-link" href="#main" data-i18n="nav.skip">Skip to content</a>
<header data-shell="header"></header>

<main id="main" class="wrap-wide">

  <div class="page-head">
    <p class="eyebrow" data-i18n="tk.eyebrow"></p>
    <h1 data-i18n="tk.heading"></h1>
    <p class="lede" data-i18n="tk.lede"></p>
  </div>

  <div class="card now-panel mb-2" id="now-panel">
    <div class="skeleton" style="height:76px">&nbsp;</div>
    <div class="skeleton" style="height:76px">&nbsp;</div>
  </div>

  <div class="advisory-strip" id="advisories" style="display:grid;gap:.5rem;margin-bottom:1.6rem"></div>

  <div class="two-col">
    <section>
      <div class="card card--pad mb-2">
        <div id="hourly-chart"></div>
      </div>

      <div class="card card--pad">
        <h3 class="mb-1" data-i18n="tk.week.title"></h3>
        <p class="tiny muted mb-2" data-i18n="tk.week.note"></p>
        <div class="week" id="week"></div>
      </div>
    </section>

    <section>
      <div class="toolbar">
        <h3 class="mb-0" data-i18n="tk.news.title"></h3>
        <div class="toolbar__spacer"></div>
        <button class="btn btn--ghost btn--sm" id="news-refresh" data-i18n="tk.news.refresh"></button>
      </div>
      <p class="tiny muted" id="news-meta"></p>
      <div id="news"></div>
    </section>
  </div>

</main>

<footer data-shell="footer"></footer>

<script src="/assets/js/i18n.js"></script>
<script src="/assets/js/shell.js"></script>
<script src="/assets/js/weather.js"></script>
<script src="/assets/js/charts.js"></script>
<script src="/assets/js/tokyo.js"></script>
</body>
</html>
