# Netlify configuration for shinyashimada.com
#
# The site is the whole repository, so leave "Base directory" empty in the
# Netlify UI and let everything below apply from the repo root.

[build]
  publish   = "."
  functions = "netlify/functions"
  command   = "npm install --omit=dev --no-audit --no-fund"

[build.environment]
  # Pinned: the functions use JSON import attributes, which need a modern Node.
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[functions."store"]
  # The plant/tasting store talks to Postgres; give it room to cold-start.
  included_files = []

# The daily balcony -> Trello sync declares its own schedule in the function
# file (export const config = { schedule: '0 21 * * *' }), which is 06:00 in
# Tokyo. It does nothing unless the sync is switched on in the site's UI.

# Friendly API paths: /api/weather -> /.netlify/functions/weather
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

# SPA-ish fallback for unknown paths -> custom 404
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "geolocation=(), camera=(), microphone=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=600"
