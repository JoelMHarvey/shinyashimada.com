<!doctype html>
<html lang="en" data-title-key="cr.title">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Croissant Hunt — Shinya Shimada</title>
<meta name="description" content="A scored search for the best chocolate croissant in Tokyo: six criteria, one running leaderboard, every score from an actual tasting.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css">
<link rel="stylesheet" href="/assets/css/viz.css">
<link rel="stylesheet" href="/assets/css/croissants.css">
<script>(function(){try{var t=localStorage.getItem('ss.theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
</head>
<body>
<a class="skip-link" href="#main" data-i18n="nav.skip">Skip to content</a>
<header data-shell="header"></header>

<main id="main" class="wrap-wide">

  <div class="page-head">
    <p class="eyebrow" data-i18n="cr.eyebrow"></p>
    <h1 data-i18n="cr.heading"></h1>
    <p class="lede" data-i18n="cr.lede"></p>
  </div>

  <div class="notice notice--sky mb-3">
    <span class="notice__icon">🥐</span>
    <div><strong data-i18n="cr.honest.title"></strong><br><span data-i18n="cr.honest.body"></span></div>
  </div>

  <div class="grid grid--4 mb-3" id="stats"></div>

  <div class="card card--pad mb-3" id="leaderboard-card">
    <div id="leaderboard"></div>
  </div>

  <div class="card card--pad mb-3 hidden" id="compare-card">
    <div id="compare-chart"></div>
  </div>

  <div class="toolbar">
    <h2 class="mb-0" data-i18n="cr.list.title"></h2>
    <span class="tiny muted" data-i18n="cr.compare.hint"></span>
    <div class="toolbar__spacer"></div>
    <div class="segmented" id="filter-status"></div>
    <button class="btn btn--terracotta btn--sm" id="add-tasting" data-i18n="cr.add"></button>
  </div>

  <div class="bakery-grid" id="bakery-grid"></div>

  <div class="compare-bar hidden" id="compare-bar">
    <span class="compare-bar__label" id="compare-label"></span>
    <span class="compare-bar__spacer"></span>
    <button class="btn btn--ghost btn--sm" id="compare-clear" data-i18n="cr.compare.clear"></button>
  </div>

</main>

<footer data-shell="footer"></footer>

<!-- Tasting form ---------------------------------------------------------->
<dialog class="modal" id="taster">
  <form method="dialog" id="taster-form">
    <div class="modal__head">
      <h2 data-i18n="cr.form.title"></h2>
      <button type="button" class="icon-button modal__close" data-close data-i18n-attr="aria-label:common.close">×</button>
    </div>
    <div class="modal__body">
      <label class="field">
        <span data-i18n="cr.form.bakery"></span>
        <select id="t-bakery"></select>
      </label>
      <label class="field" id="t-custom-wrap" hidden>
        <span data-i18n="cr.form.customBakery"></span>
        <input type="text" id="t-custom">
      </label>
      <div class="field-row">
        <label class="field">
          <span data-i18n="cr.form.date"></span>
          <input type="date" id="t-date">
        </label>
        <label class="field">
          <span data-i18n="cr.form.price"></span>
          <input type="number" id="t-price" min="0" max="5000" step="10">
        </label>
        <label class="field">
          <span data-i18n="cr.form.who"></span>
          <select id="t-who"></select>
        </label>
      </div>
      <div id="t-scores"></div>
      <label class="field">
        <span data-i18n="cr.form.notes"></span>
        <textarea id="t-notes" rows="3" data-i18n-attr="placeholder:cr.form.notesPh"></textarea>
      </label>
    </div>
    <div class="modal__foot">
      <button type="button" class="btn btn--danger btn--sm" id="t-delete" data-i18n="common.delete" hidden></button>
      <span style="flex:1"></span>
      <button type="button" class="btn btn--ghost" data-close data-i18n="common.cancel"></button>
      <button type="submit" class="btn btn--terracotta" data-i18n="common.save"></button>
    </div>
  </form>
</dialog>

<!-- Bakery detail --------------------------------------------------------->
<dialog class="modal" id="bakery">
  <div class="modal__head">
    <h2 id="bakery-name"></h2>
    <button type="button" class="icon-button modal__close" data-close data-i18n-attr="aria-label:common.close">×</button>
  </div>
  <div class="modal__body" id="bakery-body"></div>
  <div class="modal__foot">
    <button type="button" class="btn btn--terracotta btn--sm" id="bakery-taste" data-i18n="cr.addHere"></button>
    <button type="button" class="btn btn--ghost" data-close data-i18n="common.close"></button>
  </div>
</dialog>

<script src="/assets/js/i18n.js"></script>
<script src="/assets/js/shell.js"></script>
<script src="/assets/js/store.js"></script>
<script src="/assets/js/charts.js"></script>
<script src="/assets/js/croissants.js"></script>
</body>
</html>
